version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: users-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - users_pg_data:/var/lib/postgresql/data

volumes:
  users_pg_data: